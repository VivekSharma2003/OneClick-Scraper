<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneClick Scraper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Animated background orbs -->
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast hidden">
    <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
    <span id="toastText"></span>
  </div>

  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo-wrapper">
        <div class="logo-glow"></div>
        <div class="logo-ring">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 17L12 22L22 17" stroke="rgba(255,255,255,0.6)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 12L12 17L22 12" stroke="rgba(255,255,255,0.75)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
      <div class="header-text">
        <h1 class="title">OneClick Scraper</h1>
        <p class="subtitle">Extract &middot; Download &middot; Done</p>
      </div>
      <!-- History toggle -->
      <button id="btnHistory" class="btn-icon-only" title="Scrape History">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </button>
    </header>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- Status Chip -->
    <div id="statusChip" class="status-chip idle">
      <span id="statusDot" class="status-dot"></span>
      <span id="statusText" class="status-text">Ready to scrape</span>
    </div>

    <!-- Stats Panel -->
    <div id="statsPanel" class="stats-panel hidden">
      <div class="stat-card">
        <div class="stat-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        </div>
        <span class="stat-value" id="statImages">0</span>
        <span class="stat-label">Images</span>
      </div>
      <div class="stat-card">
        <div class="stat-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        </div>
        <span class="stat-value" id="statLinks">0</span>
        <span class="stat-label">Links</span>
      </div>
      <div class="stat-card">
        <div class="stat-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        </div>
        <span class="stat-value" id="statChars">0</span>
        <span class="stat-label">Text</span>
      </div>
      <div class="stat-card">
        <div class="stat-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
        </div>
        <span class="stat-value" id="statMeta">0</span>
        <span class="stat-label">Meta</span>
      </div>
    </div>

    <!-- Page Title -->
    <div id="pageTitle" class="page-title hidden">
      <svg class="page-title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      <span id="pageTitleText"></span>
    </div>

    <!-- Image Preview Grid -->
    <div id="imagePreview" class="image-preview hidden">
      <div class="section-header">
        <span class="section-title">Image Preview</span>
        <span class="section-count" id="imageCount"></span>
      </div>
      <div class="image-grid" id="imageGrid"></div>
    </div>

    <!-- Meta Tags Preview -->
    <div id="metaPreview" class="meta-preview hidden">
      <div class="section-header">
        <span class="section-title">Meta Tags</span>
      </div>
      <div class="meta-tags" id="metaTags"></div>
    </div>

    <!-- Error Message -->
    <div id="errorMessage" class="error-message hidden">
      <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      <span id="errorText"></span>
    </div>

    <!-- Action Buttons -->
    <div class="actions">
      <button id="btnScrape" class="btn btn-primary">
        <div class="btn-shimmer"></div>
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="M21 21l-4.35-4.35"/>
        </svg>
        <span class="btn-label">Scrape This Page</span>
        <div class="btn-spinner hidden" id="scrapeSpinner">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
        </div>
      </button>

      <!-- Primary download row -->
      <div class="download-row">
        <button id="btnJSON" class="btn btn-glass" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
          <span>JSON</span>
        </button>
        <button id="btnZIP" class="btn btn-glass" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span>ZIP</span>
        </button>
      </div>

      <!-- Secondary actions row -->
      <div class="secondary-row">
        <button id="btnCopy" class="btn btn-mini" disabled title="Copy JSON to clipboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          <span>Copy</span>
        </button>
        <button id="btnCSVImages" class="btn btn-mini" disabled title="Export images as CSV">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <span>IMG CSV</span>
        </button>
        <button id="btnCSVLinks" class="btn btn-mini" disabled title="Export links as CSV">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          <span>LINK CSV</span>
        </button>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-line"></div>
      <div class="footer-content">
        <span class="footer-badge">v1.1</span>
        <span class="footer-text">OneClick Scraper</span>
      </div>
    </footer>
  </div>

  <!-- History Panel (slide-in overlay) -->
  <div id="historyOverlay" class="history-overlay hidden">
    <div class="history-panel">
      <div class="history-header">
        <h2 class="history-title">Scrape History</h2>
        <div class="history-actions">
          <button id="btnClearHistory" class="btn-icon-only small" title="Clear History">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
          </button>
          <button id="btnCloseHistory" class="btn-icon-only small" title="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
      <div class="history-list" id="historyList">
        <div class="history-empty" id="historyEmpty">No scrapes yet</div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
